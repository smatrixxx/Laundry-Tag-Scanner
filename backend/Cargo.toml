[package]
name = "laundry-backend-rust"
version = "0.1.0"
edition = "2024"

url = "2"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
